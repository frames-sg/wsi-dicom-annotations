name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      external_dicom_validation:
        description: Install optional DICOM validators and run the ignored interoperability test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test feature matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Test default features
        run: cargo test --locked
      - name: Test without default features
        run: cargo test --locked --no-default-features
      - name: Test all features
        run: cargo test --locked --all-features

  quality:
    name: Format, lint, build, and documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Lint without default features
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - name: Build optimized all features
        run: cargo build --release --locked --all-features
      - name: Build optimized without default features
        run: cargo build --release --locked --no-default-features
      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - name: Compile release performance regression workload
        run: cargo test --release --locked --all-features seg_normalization_benchmark --no-run

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit locked dependencies
        run: cargo audit --db "${RUNNER_TEMP}/rustsec-advisory-db"
      - name: Reject a stale audit exception
        run: |
          cargo tree --locked --all-features --invert lru@0.16.4
          test -f "${RUNNER_TEMP}/rustsec-advisory-db/crates/lru/RUSTSEC-2026-0253.md"

  external-dicom-validation:
    name: Optional external DICOM validation
    if: github.event_name == 'workflow_dispatch' && inputs.external_dicom_validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install external validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes dcmtk dicom3tools
      - name: Run external DICOM interoperability test
        run: cargo test --locked annotation_tests::external_validator::exported_ann_and_seg_pass_external_dicom_validation -- --ignored --nocapture
