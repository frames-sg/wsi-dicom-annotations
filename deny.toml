# Dependency policy for the separately published annotation interoperability crate.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # `encoding` is transitive through dicom-encoding 0.9.1. No safe upstream
    # upgrade exists. Review by 2026-10-01 or the next dicom-rs release.
    "RUSTSEC-2021-0153",
    # `paste` is transitive through zarrs 0.23.14. No safe upgrade exists.
    # Review by 2026-10-01 or the next compatible zarrs release.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# First-party packages offer AGPLv3 or a separate commercial agreement.
[[licenses.exceptions]]
name = "wsi-dicom-annotations"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "wsi-annotation-probe"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
